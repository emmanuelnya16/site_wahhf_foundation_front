<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Site en préparation : aucune page ne doit être indexée (à retirer au lancement, avec robots.txt). -->
    <meta name="robots" content="noindex" />
    <!-- Thème appliqué AVANT le premier rendu (aucun flash clair pour les visiteurs en thème sombre).
         Même logique que Navbar : choix enregistré, sinon préférence système à la première visite. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wahhf_theme');
          var visited = localStorage.getItem('wahhf_visited_theme');
          var dark = saved === 'dark' ||
            (!saved && !visited && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>WAHHF Foundation — Autonomiser la jeunesse, transformer les communautés</title>
    <meta
      name="description"
      content="WAHHF Foundation est une fondation camerouno-allemande à but non lucratif, branche sociale du groupe IROKO : éducation, santé, entrepreneuriat, environnement et mobilité & langues 100 % gratuite."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WAHHF Foundation" />
    <meta property="og:title" content="WAHHF Foundation — Branche Sociale du Groupe IROKO" />
    <meta
      property="og:description"
      content="Fondation camerouno-allemande à but non lucratif : programmes éducatifs, sanitaires, sociaux et académie d'allemand /anglais & accompagnement vers l'Europe 100 % gratuits."
    />
    <meta property="og:image" content="/assets/aistudio/LogoWAHHF.c09000774835c3abb59a__1__a1f28366.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WAHHF Foundation — Autonomiser la jeunesse, transformer les communautés" />
    <meta
      name="twitter:description"
      content="Fondation camerouno-allemande à but non lucratif, branche sociale du groupe IROKO. Cours d'allemand /anglais A1–C1 et orientation vers l'Europe 100 % gratuits."
    />
    <meta name="theme-color" content="#0F3D2E" />
    <link rel="icon" type="image/png" href="/assets/aistudio/LogoWAHHF.c09000774835c3abb59a__1__a1f28366.png" />
    <!-- Police du site (voir src/index.css) : Atkinson Hyperlegible Next, latin, 400 pour le texte et 700 pour les titres
         (24,8 Ko à eux deux). DM Sans et Fraunces ne servent plus qu'aux pages historiques : pas de préchargement. -->
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Accueil seulement : image d'attente du hero préchargée (élément LCP ; mêmes srcset/sizes que le <picture>,
         voir src/config/heroVideo.ts) : portrait sous 768 px, paysage au-delà.
         Aucune connexion à YouTube ici : la vidéo n'est chargée qu'après la page, avec l'accord du visiteur. -->
    <script>
      if (location.pathname === '/') {
        [
          ['(max-width: 47.99rem)', '/hero/hero-film-t49-portrait-456.webp 456w, /hero/hero-film-t49-portrait-608.webp 608w'],
          ['(min-width: 48rem)', '/hero/hero-film-t49-960.webp 960w, /hero/hero-film-t49-1280.webp 1280w, /hero/hero-film-t49-1920.webp 1920w'],
        ].forEach(function (p) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/webp';
          link.media = p[0];
          link.setAttribute('imagesrcset', p[1]);
          link.setAttribute('imagesizes', '100vw');
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        });
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "WAHHF Foundation",
        "description": "Fondation camerouno-allemande à but non lucratif, branche sociale du groupe IROKO.",
        "telephone": "+49 1521 8956743",
        "address": [
          {
            "@type": "PostalAddress",
            "streetAddress": "Markt 25",
            "postalCode": "39288",
            "addressLocality": "Burg",
            "addressCountry": "DE"
          },
          {
            "@type": "PostalAddress",
            "streetAddress": "Bépanda",
            "postOfficeBoxNumber": "BP 4048",
            "addressLocality": "Douala",
            "addressCountry": "CM"
          }
        ],
        "logo": "/assets/aistudio/LogoWAHHF.c09000774835c3abb59a__1__a1f28366.png",
        "parentOrganization": {
          "@type": "Organization",
          "name": "IROKO Group"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Accueil seulement : l'image du hero est posée dans le HTML, sous son voile, avant le JavaScript (élément LCP,
         PERF-01). React remplace ce contenu à son premier rendu par le même hero (mêmes fichiers, même cadre :
         .hero-shell dans src/index.css). Décoratif, masqué aux lecteurs d'écran. -->
    <script>
      if (location.pathname === '/') {
        document.getElementById('root').innerHTML =
          '<div class="hero-shell" aria-hidden="true"><picture>' +
          '<source media="(max-width: 47.99rem)" type="image/webp" srcset="/hero/hero-film-t49-portrait-456.webp 456w, /hero/hero-film-t49-portrait-608.webp 608w" sizes="100vw">' +
          '<img src="/hero/hero-film-t49-1280.webp" srcset="/hero/hero-film-t49-960.webp 960w, /hero/hero-film-t49-1280.webp 1280w, /hero/hero-film-t49-1920.webp 1920w" sizes="100vw" width="1920" height="1080" alt="" fetchpriority="high">' +
          '</picture><div class="hero-veil"></div></div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
